<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="22" fill="#03030B" />
  <!-- Orbital Ring -->
  <ellipse cx="50" cy="50" rx="42" ry="15" fill="none" stroke="url(#purpleGrad)" stroke-width="2.5" transform="rotate(-25 50 50)" opacity="0.75" filter="url(#glow)"/>
  <!-- Stylized Cosmic S -->
  <path
    d="M 72 26 L 38 26 L 24 42 L 34 50 L 64 50 L 74 60 L 60 76 L 26 76"
    stroke="url(#purpleGrad)"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    filter="url(#glow)"
  />
  <circle cx="72" cy="26" r="4.5" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="26" cy="76" r="4.5" fill="#C084FC" filter="url(#glow)" />
</svg>